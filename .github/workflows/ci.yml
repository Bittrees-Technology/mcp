name: Standalone MCP service checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: mcp_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
        env:
          MCP_TEST_DATABASE_URL: postgres://mcp_test:test_only@127.0.0.1:5432/mcp_test
      - run: npm run check
      - run: npm run build
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config scripts/browser.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-workspace-review
          path: test-results/
          retention-days: 7
